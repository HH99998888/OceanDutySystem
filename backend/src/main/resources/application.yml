server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  application:
    name: ocean-duty-monitor
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:data/ocean-duty.db
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    cn.nmefc: INFO

# 灾害预警业务库：所有连接信息均由部署环境注入，严禁提交真实凭据。
ocean:
  alarm-db:
    enabled: ${OCEAN_ALARM_DB_ENABLED:false}
    url: ${OCEAN_ALARM_DB_URL:}
    username: ${OCEAN_ALARM_DB_USERNAME:}
    password: ${OCEAN_ALARM_DB_PASSWORD:}
