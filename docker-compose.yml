services:
  backend:
    build: ./backend
    ports:
      - "8081:8081"
    environment:
      # 仅透传部署环境中的密钥；不在 compose 文件中保存真实连接信息。
      OCEAN_ALARM_DB_ENABLED: ${OCEAN_ALARM_DB_ENABLED:-false}
      OCEAN_ALARM_DB_URL: ${OCEAN_ALARM_DB_URL:-}
      OCEAN_ALARM_DB_USERNAME: ${OCEAN_ALARM_DB_USERNAME:-}
      OCEAN_ALARM_DB_PASSWORD: ${OCEAN_ALARM_DB_PASSWORD:-}
      OCEAN_GRID_DB_ENABLED: ${OCEAN_GRID_DB_ENABLED:-false}
      OCEAN_GRID_DB_URL: ${OCEAN_GRID_DB_URL:-}
      OCEAN_GRID_DB_USERNAME: ${OCEAN_GRID_DB_USERNAME:-}
      OCEAN_GRID_DB_PASSWORD: ${OCEAN_GRID_DB_PASSWORD:-}
      OCEAN_GRID_FTP_ENABLED: ${OCEAN_GRID_FTP_ENABLED:-false}
      OCEAN_GRID_FTP_HOST: ${OCEAN_GRID_FTP_HOST:-}
      OCEAN_GRID_FTP_PORT: ${OCEAN_GRID_FTP_PORT:-21}
      OCEAN_GRID_FTP_USERNAME: ${OCEAN_GRID_FTP_USERNAME:-}
      OCEAN_GRID_FTP_PASSWORD: ${OCEAN_GRID_FTP_PASSWORD:-}
      OCEAN_GRID_FTP_OUTPUT_DIRECTORY: ${OCEAN_GRID_FTP_OUTPUT_DIRECTORY:-/OutputData}
      OCEAN_GRID_FTP_ROOT_DIRECTORY: ${OCEAN_GRID_FTP_ROOT_DIRECTORY:-/}
      OCEAN_GRID_FTP_WIND_DIRECTORY: ${OCEAN_GRID_FTP_WIND_DIRECTORY:-wind}
      OCEAN_GRID_FTP_WAVE_DIRECTORY: ${OCEAN_GRID_FTP_WAVE_DIRECTORY:-wave}
      OCEAN_GRID_FTP_CURRENT_DIRECTORY: ${OCEAN_GRID_FTP_CURRENT_DIRECTORY:-current}
      OCEAN_GRID_FTP_SST_DIRECTORY: ${OCEAN_GRID_FTP_SST_DIRECTORY:-sst}
      OCEAN_GRID_FTP_TIDE_DIRECTORY: ${OCEAN_GRID_FTP_TIDE_DIRECTORY:-storm_tide}
    volumes:
      - ocean-data:/app/data
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  ocean-data:
